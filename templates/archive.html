<section class="mb-8">
    <h1 class="text-3xl font-bold mb-2">{{title}}</h1>
    <p class="opacity-70">A chronological archive of all posts</p>
</section>

<section class="timeline timeline-snap-icon timeline-vertical max-w-2xl">
    {% for post-group in post-groups %}
    <li>
        <hr class="bg-base-300" />
        <div class="timeline-start">
            <time class="font-mono text-lg">
                <span class="badge badge-primary badge-lg">{{post-group.year}}</span>
            </time>
        </div>
        <hr class="bg-base-300" />
    </li>
    {% for post-link in post-group.post-links %}
    <li>
        <hr class="bg-base-300" />
        <div class="timeline-middle">
            <div class="h-4 w-4 rounded-full bg-primary"></div>
        </div>
        <div class="timeline-end timeline-box bg-base-100 border border-base-200 p-4 rounded-lg hover:border-primary transition-colors">
            <time class="font-mono text-sm opacity-60">{{post-link.date}}</time>
            <div class="mt-1">
                <a class="link link-hover font-medium text-lg" href="{{post-link.url}}">{{post-link.title}}</a>
            </div>
        </div>
        <hr class="bg-base-300" />
    </li>
    {% endfor %}
    {% endfor %}
</section>

<div class="mt-8">
    <a href="#" class="btn btn-ghost btn-sm gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
        </svg>
        Back to top
    </a>
</div>

<section class="page-intro reveal">
    <p class="section-kicker">Archive</p>
    <h1 class="section-title">{{title}}</h1>
    <p class="page-intro-copy">A chronological view of everything published here.</p>
</section>

<section class="archive-list reveal">
    {% for post-group in post-groups %}
    <section class="archive-year">
        <div class="archive-year-heading">{{post-group.year}}</div>
        <div class="archive-year-posts">
        {% for post-link in post-group.post-links %}
        <article class="archive-entry">
            <time class="archive-entry-date">{{post-link.date}}</time>
            <a class="archive-entry-title" href="{{post-link.url}}">{{post-link.title}}</a>
        </article>
        {% endfor %}
        </div>
    </section>
    {% endfor %}
</section>

<div class="section-closing reveal">
    <a href="#" class="text-link muted-link">Back to top</a>
</div>

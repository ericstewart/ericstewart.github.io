<section class="page-intro reveal">
    <p class="section-kicker">Topics</p>
    <h1 class="section-title">{{title}}</h1>
    <p class="page-intro-copy">Browse posts by subject without the card-heavy catalog feel.</p>
</section>

<section class="tag-directory reveal">
    {% for tag in tags %}
    <a href="{{tag.url}}" class="tag-directory-item">
        <span class="tag-directory-name">{{tag.tag}}</span>
        <span class="tag-directory-count">{{tag.count}} post{{tag.count|pluralize}}</span>
    </a>
    {% endfor %}
</section>

<div class="section-closing reveal">
    <a href="#top" class="text-link muted-link">Back to top</a>
</div>
